[package]
name = "xmu_secure_link"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
cmake = "0.1"
embed-manifest = "1"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4", features = ["derive", "env"] }
cipher = "0.4"
directories = "5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
